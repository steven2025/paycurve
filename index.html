<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>岗位评价与市场薪酬曲线课堂练习系统</title>
<style>
  :root{
    --bg:#f5f7fb; --panel:#ffffff; --ink:#172033; --muted:#667085; --line:#d9e1ef;
    --brand:#2563eb; --brand2:#0f766e; --danger:#dc2626; --warn:#b45309; --ok:#15803d;
    --nav:#0f172a; --nav2:#18243a; --soft:#eff6ff; --soft2:#f0fdfa;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Microsoft YaHei",sans-serif;font-size:15px;}
  .app{height:100vh;display:flex;overflow:hidden;}
  aside{width:15%;min-width:190px;max-width:260px;background:linear-gradient(180deg,var(--nav),var(--nav2));color:#fff;display:flex;flex-direction:column;}
  .brand{padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.12);}
  .brand h1{font-size:18px;line-height:1.25;margin:0 0 8px;font-weight:800;}
  .brand p{font-size:12px;margin:0;color:#cbd5e1;line-height:1.5;}
  .nav{padding:10px;overflow:auto;}
  .nav button{width:100%;border:0;background:transparent;color:#e5e7eb;text-align:left;padding:10px 10px;border-radius:10px;cursor:pointer;margin:2px 0;font-size:14px;line-height:1.35;}
  .nav button:hover{background:rgba(255,255,255,.08)}
  .nav button.active{background:#2563eb;color:#fff;font-weight:700;}
  .nav button.locked{opacity:.55;}
  .sidefoot{margin-top:auto;padding:10px 14px;font-size:12px;color:#cbd5e1;border-top:1px solid rgba(255,255,255,.1);}
  main{width:85%;height:100vh;overflow:auto;padding:18px 22px;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px;}
  .topbar h2{font-size:24px;margin:0;}
  .statusbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:6px 10px;font-size:12px;border:1px solid var(--line);background:#fff;color:var(--muted);}
  .badge.ok{background:#ecfdf5;color:var(--ok);border-color:#bbf7d0;}
  .badge.warn{background:#fffbeb;color:var(--warn);border-color:#fde68a;}
  .badge.danger{background:#fef2f2;color:var(--danger);border-color:#fecaca;}
  .grid{display:grid;gap:14px;}
  .grid.two{grid-template-columns:1fr 1fr;}
  .grid.three{grid-template-columns:repeat(3,1fr);}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 8px 22px rgba(15,23,42,.04);}
  .card h3{margin:0 0 10px;font-size:18px;}
  .card h4{margin:12px 0 8px;font-size:15px;}
  .muted{color:var(--muted);}
  .small{font-size:12px;color:var(--muted);}
  .help{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:12px;padding:12px;line-height:1.75;}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  button.primary,.btn{border:0;background:var(--brand);color:white;border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:700;}
  button.secondary{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:700;}
  button.danger{border:0;background:var(--danger);color:white;border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:700;}
  button:disabled{opacity:.5;cursor:not-allowed;}
  input,select,textarea{width:100%;padding:9px 10px;border:1px solid #cfd8e6;border-radius:10px;background:#fff;font-size:14px;}
  textarea{min-height:80px;resize:vertical;}
  label{display:block;font-weight:700;margin-bottom:6px;}
  .formrow{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:12px;}
  .formrow.three{grid-template-columns:repeat(3,1fr);}
  table{width:100%;border-collapse:collapse;background:#fff;}
  th,td{border:1px solid #d8e0ef;padding:8px;text-align:center;vertical-align:middle;}
  th{background:#eef4ff;font-weight:800;}
  td.left,th.left{text-align:left;}
  .tablewrap{max-width:100%;overflow:auto;border-radius:12px;border:1px solid var(--line);}
  .tablewrap table{border:0;}
  .tablewrap th:first-child,.tablewrap td:first-child{border-left:0;}
  .pill{display:inline-block;border-radius:999px;background:#eef2ff;color:#3730a3;padding:3px 8px;font-size:12px;}
  .levelbar{display:flex;gap:6px;justify-content:center;}
  .levelbar label{font-weight:600;margin:0;display:inline-flex;align-items:center;gap:3px;border:1px solid var(--line);border-radius:999px;padding:4px 7px;background:#fff;cursor:pointer;}
  .levelbar input{width:auto;margin:0;}
  .jobtabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;}
  .jobtabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;cursor:pointer;}
  .jobtabs button.done{background:#ecfdf5;border-color:#86efac;color:#166534;}
  .jobtabs button.active{background:var(--brand);color:#fff;border-color:var(--brand);}
  .lockedbox{padding:26px;border:1px dashed #f59e0b;background:#fffbeb;border-radius:16px;color:#92400e;}
  .progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden;}
  .progress span{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#22c55e);}
  .svgbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;overflow:auto;}
  svg text{font-family:Arial,"Microsoft YaHei",sans-serif;}
  .legend{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0;}
  .legend span{display:inline-flex;align-items:center;gap:6px;font-size:13px;}
  .dot{width:10px;height:10px;border-radius:999px;display:inline-block;}
  .notice{padding:10px 12px;border-radius:12px;background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;margin:10px 0;line-height:1.65;}
  .error{padding:10px 12px;border-radius:12px;background:#fef2f2;border:1px solid #fecaca;color:#991b1b;margin:10px 0;line-height:1.65;}
  .success{padding:10px 12px;border-radius:12px;background:#ecfdf5;border:1px solid #bbf7d0;color:#166534;margin:10px 0;line-height:1.65;}
  .kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .kpi .item{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:12px;}
  .kpi .num{font-size:24px;font-weight:900;color:#1d4ed8;}
  @media(max-width:900px){aside{width:230px}main{width:calc(100% - 230px)}.grid.two,.grid.three,.formrow,.formrow.three,.kpi{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>

  <main>
    <div class="topbar">

  {rank:17, percentile:0.15, values:{'J01':2700,'J02':3200,'J03':3800,'J04':4400,'J05':6600,'J06':7300,'J07':9500,'J08':14200,'J09':19600,'J10':24700,'J11':30000}},

  {rank:19, percentile:0.05, values:{'J01':2500,'J02':3000,'J03':3600,'J04':4000,'J05':6000,'J06':6500,'J07':8500,'J08':13000,'J09':18400,'J10':23500,'J11':28600}}
];
const PERCENTILES = [
  {key:'p25', value:0.25, label:'P25 / 25th percentile', color:'#0f766e'},
  {key:'p50', value:0.50, label:'P50 / 50th percentile', color:'#2563eb'},
  {key:'p75', value:0.75, label:'P75 / 75th percentile', color:'#dc2626'}
];

const VIEWS = [
  {id:'setup', title:'0. 课堂设置 / Cloud Setup'},
  {id:'standard', title:'1. 岗位评价标准'},
  {id:'rating', title:'2. 学生岗位评价'},
  {id:'submit', title:'3. 提交与完成进度'},
  {id:'summary', title:'4. 岗位薪点统计展示'},
  {id:'market', title:'5. 原始市场薪酬表', locked:true},
  {id:'analysis', title:'6. 薪点 × 市场薪酬表', locked:true},
  {id:'curve', title:'7. 曲线与方程', locked:true},
  {id:'predict', title:'8. 新岗位薪酬预测', locked:true},
  {id:'report', title:'9. 报告与导出', locked:true}
];

let appState = {
  view:'setup', currentJob:'J01', selectedPercentiles:['p50'], summary:null, progress:null,
  lastEquations:null, statusMessage:'', errorMessage:''
};

function $(id){return document.getElementById(id)}
function money(n){return Number(n||0).toLocaleString('zh-CN',{maximumFractionDigits:0})}
function fmt(n,d=2){return Number(n||0).toFixed(d)}
function safe(s){return String(s||'').replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function saveSettings(){ localStorage.setItem('paycurve_settings', JSON.stringify(getSettings())); }
function loadSettings(){
  const def={apiBase:'', classId:'HRM2026A', studentId:'', studentName:'', groupName:'', requiredStudents:0, adminToken:''};
  try{return {...def,...JSON.parse(localStorage.getItem('paycurve_settings')||'{}')}}catch(e){return def}
}
function getSettings(){
  return {
    apiBase: $('apiBase')?.value?.trim() ?? loadSettings().apiBase,
    classId: $('classId')?.value?.trim() ?? loadSettings().classId,
    studentId: $('studentId')?.value?.trim() ?? loadSettings().studentId,
    studentName: $('studentName')?.value?.trim() ?? loadSettings().studentName,
    groupName: $('groupName')?.value?.trim() ?? loadSettings().groupName,
    requiredStudents: Number($('requiredStudents')?.value ?? loadSettings().requiredStudents ?? 0),
    adminToken: $('adminToken')?.value?.trim() ?? loadSettings().adminToken
  };
}
function storageKey(name){const s=loadSettings();return `paycurve_${name}_${s.classId||'HRM2026A'}`}
function modeIsCloud(){return !!loadSettings().apiBase}
function getPhase(){
  if(appState.summary?.state?.phase) return appState.summary.state.phase;
  if(appState.progress?.state?.phase) return appState.progress.state.phase;
  try{return JSON.parse(localStorage.getItem(storageKey('state'))||'{}').phase || 'job_evaluation'}catch(e){return 'job_evaluation'}
}
function isMarketUnlocked(){return ['market_unlocked','curve_analysis','completed'].includes(getPhase())}
function setLocalState(obj){localStorage.setItem(storageKey('state'), JSON.stringify({...getLocalState(),...obj}))}
function getLocalState(){try{return JSON.parse(localStorage.getItem(storageKey('state'))||'{"phase":"job_evaluation"}')}catch(e){return {phase:'job_evaluation'}}}
function myRatingsKey(){const s=loadSettings();return `paycurve_myRatings_${s.classId}_${s.studentId||'anonymous'}`}
function getMyRatings(){try{return JSON.parse(localStorage.getItem(myRatingsKey())||'{}')}catch(e){return {}}}
function setMyRatings(r){localStorage.setItem(myRatingsKey(), JSON.stringify(r))}

function navRender(){
  const nav=$('nav');
  nav.innerHTML = VIEWS.map(v=>`<button class="${appState.view===v.id?'active':''} ${v.locked&&!isMarketUnlocked()?'locked':''}" onclick="go('${v.id}')">${safe(v.title)}${v.locked&&!isMarketUnlocked()?' 🔒':''}</button>`).join('');
  $('modeMini').innerHTML = modeIsCloud() ? '云端模式 Cloud' : '本地演示 Local';
}
function statusRender(){
  const s=loadSettings(); const phase=getPhase();
  const phaseZh={job_evaluation:'岗位评价中',point_summary:'薪点展示',market_unlocked:'市场薪酬已解锁',curve_analysis:'曲线分析',completed:'完成'}[phase]||phase;
  $('statusbar').innerHTML = `
    <span class="badge ${modeIsCloud()?'ok':'warn'}">${modeIsCloud()?'Cloud API':'Local Demo'}</span>
    <span class="badge">Class: ${safe(s.classId||'-')}</span>
    <span class="badge">Student: ${safe(s.studentId||'-')}</span>
    <span class="badge ${isMarketUnlocked()?'ok':'warn'}">${safe(phaseZh)}</span>
  `;
}
function go(id){
  appState.view=id;
  appState.errorMessage=''; appState.statusMessage='';
  render();
}
function render(){
  navRender(); statusRender();
  const v = VIEWS.find(x=>x.id===appState.view) || VIEWS[0];
  $('viewTitle').textContent = v.title;
  if(v.locked && !isMarketUnlocked()) return renderLocked();
  ({setup:renderSetup, standard:renderStandard, rating:renderRating, submit:renderSubmit, summary:renderSummary, market:renderMarket, analysis:renderAnalysis, curve:renderCurve, predict:renderPredict, report:renderReport}[appState.view]||renderSetup)();
}
function alertBlocks(){
  return `${appState.errorMessage?`<div class="error">${safe(appState.errorMessage)}</div>`:''}${appState.statusMessage?`<div class="success">${safe(appState.statusMessage)}</div>`:''}`;
}
function renderLocked(){
  $('app').innerHTML = `${alertBlocks()}<div class="lockedbox"><h3>该步骤尚未解锁</h3><p>根据课堂流程，必须先完成所有学生对所有岗位的岗位评价，并在“岗位薪点统计展示”环节展示结果后，才能查看市场薪酬表、薪点对应表、曲线和方程。</p><p class="small">教师可在“提交与完成进度”或“岗位薪点统计展示”中刷新进度，并在条件满足后解锁市场薪酬阶段。</p></div>`;
}

function renderSetup(){
  const s=loadSettings();
  $('app').innerHTML = `${alertBlocks()}
  <div class="grid two">
    <div class="card">
      <h3>课堂与云函数设置</h3>

      <div class="formrow"><div><label>Cloud Function API Base URL</label><input id="apiBase" value="${safe(s.apiBase)}" placeholder="例如：https://service-xxx.gz.apigw.tencentcs.com/release/payCurveApi" /></div><div><label>Class ID / 课堂码</label><input id="classId" value="${safe(s.classId)}" /></div></div>
      <div class="formrow three"><div><label>Student ID / 学号</label><input id="studentId" value="${safe(s.studentId)}" placeholder="S001" /></div><div><label>Student Name / 姓名</label><input id="studentName" value="${safe(s.studentName)}" placeholder="张三" /></div><div><label>Group Name / 小组</label><input id="groupName" value="${safe(s.groupName)}" placeholder="Group 1" /></div></div>
      <div class="formrow"><div><label>Required Students / 应提交人数</label><input id="requiredStudents" type="number" min="0" value="${Number(s.requiredStudents||0)}" /></div><div><label>Admin Token / 教师口令</label><input id="adminToken" type="password" value="${safe(s.adminToken)}" placeholder="教师端解锁、重置使用" /></div></div>
      <div class="btns"><button class="primary" onclick="saveSetup()">保存设置</button><button class="secondary" onclick="testCloud()">测试云函数连接</button><button class="secondary" onclick="go('standard')">进入练习</button></div>
    </div>
    <div class="card">

      <ol style="line-height:1.9;margin-top:0">
        <li>学生先完成 11 个岗位评价。</li>
        <li>系统统计每个岗位的平均薪点、最高分、最低分、标准差。</li>
        <li>所有学生完成后，教师解锁市场薪酬。</li>
        <li>学生查看原始市场薪酬表和“薪点 × 市场薪酬”分析表。</li>
        <li>学生勾选 P25/P50/P75 生成曲线、方程和 R²。</li>

function regression(xs,ys){
  const n=xs.length, mx=xs.reduce((a,b)=>a+b,0)/n, my=ys.reduce((a,b)=>a+b,0)/n;
  let sxx=0,sxy=0,syy=0; for(let i=0;i<n;i++){sxx+=(xs[i]-mx)**2;sxy+=(xs[i]-mx)*(ys[i]-my);syy+=(ys[i]-my)**2;}
  const slope=sxx===0?0:sxy/sxx, intercept=my-slope*mx;
  const ssRes=ys.reduce((acc,y,i)=>acc+(y-(slope*xs[i]+intercept))**2,0);
  const r2=syy===0?1:1-ssRes/syy;
  return {slope,intercept,r2};
}
function equationText(eq){return `y = ${fmt(eq.slope,4)}x ${eq.intercept>=0?'+':'-'} ${fmt(Math.abs(eq.intercept),2)}`}
function drawCurve(data, selected){
  const ps=PERCENTILES.filter(p=>selected.includes(p.key));
  const xs=data.map(d=>d.points);
  const yVals=[]; ps.forEach(p=>data.forEach(d=>yVals.push(d[p.key])));
  const xMin=Math.min(...xs), xMax=Math.max(...xs), yMin=Math.min(...yVals), yMax=Math.max(...yVals);
  const W=1080,H=560,M={l:70,r:30,t:30,b:70};
  const sx=x=>M.l+(x-xMin)/(xMax-xMin||1)*(W-M.l-M.r);
  const sy=y=>H-M.b-(y-yMin)/(yMax-yMin||1)*(H-M.t-M.b);
  let svg=`<div class="legend">${ps.map(p=>`<span><i class="dot" style="background:${p.color}"></i>${p.label}</span>`).join('')}</div><div class="svgbox"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  svg+=`<rect x="0" y="0" width="${W}" height="${H}" fill="#ffffff"/>`;
  for(let i=0;i<=5;i++){const y=yMin+(yMax-yMin)*i/5; const yy=sy(y); svg+=`<line x1="${M.l}" y1="${yy}" x2="${W-M.r}" y2="${yy}" stroke="#e5e7eb"/><text x="${M.l-10}" y="${yy+4}" text-anchor="end" font-size="12" fill="#64748b">${money(y)}</text>`}
  for(let i=0;i<=5;i++){const x=xMin+(xMax-xMin)*i/5; const xx=sx(x); svg+=`<line x1="${xx}" y1="${M.t}" x2="${xx}" y2="${H-M.b}" stroke="#f1f5f9"/><text x="${xx}" y="${H-M.b+22}" text-anchor="middle" font-size="12" fill="#64748b">${fmt(x,0)}</text>`}
  svg+=`<line x1="${M.l}" y1="${H-M.b}" x2="${W-M.r}" y2="${H-M.b}" stroke="#334155"/><line x1="${M.l}" y1="${M.t}" x2="${M.l}" y2="${H-M.b}" stroke="#334155"/>`;
  svg+=`<text x="${W/2}" y="${H-20}" text-anchor="middle" font-size="14" fill="#334155">Average Job Points / 平均岗位薪点</text>`;
  svg+=`<text transform="translate(18 ${H/2}) rotate(-90)" text-anchor="middle" font-size="14" fill="#334155">Market Salary / 市场薪酬</text>`;
  const equations={};
  ps.forEach(p=>{
    const ys=data.map(d=>d[p.key]); const eq=regression(xs,ys); equations[p.key]=eq;
    const yA=eq.slope*xMin+eq.intercept, yB=eq.slope*xMax+eq.intercept;
    svg+=`<line x1="${sx(xMin)}" y1="${sy(yA)}" x2="${sx(xMax)}" y2="${sy(yB)}" stroke="${p.color}" stroke-width="3" opacity=".85"/>`;
    data.forEach(d=>{svg+=`<circle cx="${sx(d.points)}" cy="${sy(d[p.key])}" r="5" fill="${p.color}" opacity=".85"><title>${d.jobName} · ${p.key.toUpperCase()} · ${fmt(d.points,1)} points · ${money(d[p.key])}</title></circle>`});
  });
  data.forEach(d=>{svg+=`<text x="${sx(d.points)+7}" y="${sy(Math.max(...ps.map(p=>d[p.key]))) - 7}" font-size="11" fill="#334155">${safe(d.jobName)}</text>`});
  svg+='</svg></div>';
  appState.lastEquations=equations;
  const rows=ps.map(p=>`<tr><td>${p.label}</td><td>${equationText(equations[p.key])}</td><td>${fmt(equations[p.key].r2,4)}</td></tr>`).join('');
  return svg+`<div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>Percentile</th><th>Linear Equation</th><th>R²</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function renderPredict(){
  const data=buildAnalysisTable(); if(!appState.lastEquations) { PERCENTILES.forEach(p=>{ if(appState.selectedPercentiles.includes(p.key)) regression(data.map(d=>d.points), data.map(d=>d[p.key])); }); }

function doPredict(){
  const data=buildAnalysisTable(); const points=Number($('newJobPoints').value); const key=$('predPercentile').value;
  if(!points){$('predictResult').innerHTML='<div class="error">请输入有效岗位薪点。</div>'; return;}
  const xs=data.map(d=>d.points), ys=data.map(d=>d[key]); const eq=regression(xs,ys); const salary=eq.slope*points+eq.intercept;
  const minX=Math.min(...xs), maxX=Math.max(...xs); const extra=(points<minX||points>maxX);
  $('predictResult').innerHTML=`<div class="success"><b>${safe($('newJobName').value||'New Job')}</b> 的预测薪酬：<b>${money(salary)}</b><br>采用方程：${equationText(eq)}，R²=${fmt(eq.r2,4)}${extra?'<br><b>提醒：</b>该薪点超出现有岗位薪点范围，属于外推预测，可靠性较低。':''}</div>`;
}

  const sum=appState.summary || computeLocalSummary(); const analysis=buildAnalysisTable();
  const summaryRows=(sum.jobPointSummary||[]).slice().sort((a,b)=>a.averagePoints-b.averagePoints).map((x,i)=>`<tr><td>${i+1}</td><td>${safe(x.jobName)}</td><td>${fmt(x.averagePoints,1)}</td><td>${x.ratingCount}</td><td>${fmt(x.standardDeviation,1)}</td></tr>`).join('');
  const analysisRows=analysis.map((x,i)=>`<tr><td>${i+1}</td><td>${safe(x.jobName)}</td><td>${fmt(x.points,1)}</td><td>${money(x.p25)}</td><td>${money(x.p50)}</td><td>${money(x.p75)}</td></tr>`).join('');
  $('app').innerHTML = `${alertBlocks()}<div class="card" id="reportArea"><h3>课堂练习报告</h3><p class="small">可直接打印为 PDF，或导出 JSON 数据。</p><h4>一、岗位薪点汇总</h4><div class="tablewrap"><table><thead><tr><th>Rank</th><th>Job</th><th>Average Points</th><th>Count</th><th>Std. Dev.</th></tr></thead><tbody>${summaryRows}</tbody></table></div><h4>二、薪点 × 市场薪酬分析表</h4><div class="tablewrap"><table><thead><tr><th>Rank</th><th>Job</th><th>Points</th><th>P25</th><th>P50</th><th>P75</th></tr></thead><tbody>${analysisRows}</tbody></table></div><h4>三、小组分析填写区</h4><textarea placeholder="请学生填写：哪些岗位评分分歧较大？公司采用 P25/P50/P75 的含义是什么？哪些岗位可能存在市场溢价？"></textarea></div><div class="btns"><button class="primary" onclick="window.print()">打印 / 另存 PDF</button><button class="secondary" onclick="downloadJson()">导出 JSON</button></div>`;
}
function downloadJson(){
  const payload={settings:loadSettings(), summary:appState.summary || computeLocalSummary(), analysisTable:buildAnalysisTable(), exportedAt:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='pay_curve_report.json'; a.click(); URL.revokeObjectURL(url);
}

async function apiCall(action,payload){
  const s=loadSettings();
  if(!s.apiBase) return localApi(action,payload);
  const res=await fetch(s.apiBase,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,classId:s.classId,...payload})});
  let data; try{data=await res.json()}catch(e){throw new Error('返回结果不是 JSON')}
  if(!res.ok || data.ok===false) throw new Error(data.error||data.message||('HTTP '+res.status));
  return data;
}
function localGetSubmissions(){try{return JSON.parse(localStorage.getItem(storageKey('submissions'))||'[]')}catch(e){return []}}
function localSetSubmissions(a){localStorage.setItem(storageKey('submissions'), JSON.stringify(a))}
function localApi(action,payload){
  const s=loadSettings();
  if(action==='health') return {ok:true,message:'Local demo mode'};
  if(action==='submitRating'){
    let a=localGetSubmissions(); const sub=payload.submission; const idx=a.findIndex(x=>x.studentId===sub.studentId); if(idx>=0)a[idx]=sub; else a.push(sub); localSetSubmissions(a); return {ok:true,message:'saved locally'};
  }
  if(action==='setConfig'){ localStorage.setItem(storageKey('config'), JSON.stringify({requiredStudents:Number(payload.requiredStudents||s.requiredStudents||0)})); return {ok:true}; }
  if(action==='getProgress'){
    const a=localGetSubmissions(), cfg=JSON.parse(localStorage.getItem(storageKey('config'))||'{}'); const required=Number(cfg.requiredStudents||s.requiredStudents||0);
    const allCompleted=required>0 && a.length>=required && a.every(sub=>sub.ratings&&sub.ratings.length===JOBS.length);
    return {ok:true, submissionsCount:a.length, requiredStudents:required, allCompleted, state:getLocalState(), submissions:a.map(x=>({studentId:x.studentId,studentName:x.studentName,groupName:x.groupName,submittedAt:x.submittedAt,completedJobs:(x.ratings||[]).length}))};
  }
  if(action==='getSummary') return computeLocalSummary();
  if(action==='unlockMarket'){
    const sum=computeLocalSummary();
    if(!sum.allCompleted) throw new Error('本地模式：尚未达到应提交人数，不能解锁。可在设置中调整 Required Students 后重试。');
    setLocalState({phase:'market_unlocked', unlockedAt:new Date().toISOString()}); return {ok:true,message:'本地模式已解锁市场薪酬'};
  }
  if(action==='resetClass'){ localSetSubmissions([]); setLocalState({phase:'job_evaluation'}); return {ok:true}; }
  throw new Error('Unknown action: '+action);
}
function computeLocalSummary(){
  const s=loadSettings(); const a=localGetSubmissions(); let cfg={}; try{cfg=JSON.parse(localStorage.getItem(storageKey('config'))||'{}')}catch(e){}
  const required=Number(cfg.requiredStudents||s.requiredStudents||0);
  const arr=JOBS.map(j=>{
    const vals=[]; a.forEach(sub=>{ const r=(sub.ratings||[]).find(x=>x.jobId===j.id); if(r && Number.isFinite(Number(r.totalPoints))) vals.push(Number(r.totalPoints)); });
    const n=vals.length, mean=n?vals.reduce((x,y)=>x+y,0)/n:0, min=n?Math.min(...vals):0, max=n?Math.max(...vals):0;
    const sd=n>1?Math.sqrt(vals.reduce((acc,v)=>acc+(v-mean)**2,0)/(n-1)):0;
    return {jobId:j.id, jobName:j.name, ratingCount:n, averagePoints:mean, minPoints:min, maxPoints:max, standardDeviation:sd};
  });
  const allCompleted=required>0 && a.length>=required && arr.every(x=>x.ratingCount>=required);
  return {ok:true, classId:s.classId, submissionsCount:a.length, requiredStudents:required, allCompleted, state:getLocalState(), jobPointSummary:arr};
}

render();
</script>
